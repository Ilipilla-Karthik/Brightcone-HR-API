[package]
name = "brightcone-hr-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid", "tls-none", "migrate"] }
dotenvy = "0.15"
loco-rs = { version = "1.2.0", default-features = false, features = ["auth", "cli", "with-db", "cache_inmem", "worker"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", default-features = false }
async-trait = "0.1"
tracing = "0.1"

